name: Generate AI MCQ drafts

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Section to generate"
        required: true
        default: all
        type: choice
        options:
          - all
          - anatomy
          - pathology
          - pharmacology
          - microbiology-immunology
          - principles-of-surgery
      count:
        description: "Questions per section (1-20)"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate drafts with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: |
          set -euo pipefail
          python3 scripts/generate-ai-mcqs.py \
            --section "${{ inputs.section }}" \
            --count "${{ inputs.count }}"

      - name: Commit generated drafts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ai-mcq/manifest.json public/ai-mcq/generated/
          git diff --cached --quiet && { echo "No generated changes"; exit 0; }
          git commit -m "Generate AI MCQ drafts via Groq"
          git push
