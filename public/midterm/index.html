<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS Diploma Midterm</title>
<meta name="description" content="Midterm revision for the General Surgery Diploma: full exams, practice, rapid rounds, flashcards and spaced review from the course question banks.">
<meta name="theme-color" content="#0e5a66">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
<script>
  // Apply saved theme and text size before first paint (avoids a flash).
  try {
    var s = JSON.parse(localStorage.getItem('gsd.midterm.v2') || '{}').settings || {};
    if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
    if (s.text) document.documentElement.style.setProperty('--scale', s.text / 100);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="bar">
    <button class="brand" id="homeBtn" type="button" aria-label="Go to home">
      <span class="logo" aria-hidden="true">GS</span>
      <span><strong>GS Diploma</strong><small>Midterm revision</small></span>
    </button>
    <div class="chips">
      <span class="chip" id="streakChip" title="Daily streak"></span>
      <span class="chip" id="levelChip" title="Level and XP"></span>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">⚙︎</button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1"><p class="loading">Loading question bank…</p></main>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="settings" aria-labelledby="settingsTitle"></dialog>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="./app.js" defer></script>
</body>
</html>
