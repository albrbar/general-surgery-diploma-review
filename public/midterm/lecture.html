<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture Question Bank | GSDIPLOMAREVISION</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17313b;background:#f3f8f7}*{box-sizing:border-box}body{margin:0}a{color:inherit}.bar,.shell{max-width:1100px;margin:auto}.topbar{background:#fff;border-bottom:1px solid #d9e8e5}.bar{padding:14px 22px;display:flex;justify-content:space-between;gap:15px}.brand,.back{color:#0f766e;text-decoration:none;font-weight:850}.shell{padding:28px 20px 60px}.hero,.card{background:#fff;border:1px solid #d9e8e5;border-radius:20px;box-shadow:0 8px 25px #134e4a0b}.hero{background:linear-gradient(125deg,#0d3d46,#0f766e 70%,#0e7490);color:#fff;padding:30px}.eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#bce9e3;font-weight:850}.hero h1{margin:.55rem 0;font-size:clamp(1.8rem,5vw,3rem)}.hero p{line-height:1.65;color:#d9f4f0}.drive{display:inline-block;margin-top:12px;padding:11px 15px;border-radius:10px;background:#fff;color:#0f766e;text-decoration:none;font-weight:850}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.meta span{background:#edf7f5;color:#0f766e;border-radius:999px;padding:7px 10px;font-size:.82rem;font-weight:800}.card{padding:22px;margin-top:18px}.question-top{display:flex;justify-content:space-between;gap:10px;color:#0f766e;font-weight:800}.difficulty{background:#edf7f5;border-radius:99px;padding:6px 9px;text-transform:capitalize}.stem{font-size:1.25rem;line-height:1.55;color:#193740}.options{display:grid;gap:10px}.option{border:1px solid #d4e4e2;background:#fbfdfd;text-align:left;display:flex;gap:10px;padding:13px;border-radius:12px;color:#294950;cursor:pointer;font:inherit;line-height:1.45}.option:hover{border-color:#0f766e;background:#eaf8f5}.option.correct{border-color:#29956d;background:#edf9f2}.option.wrong{border-color:#d27b72;background:#fff2f0}.letter{width:28px;height:28px;border-radius:8px;background:#e8f2f0;color:#0f766e;display:grid;place-items:center;font-weight:850;flex:none}.explanation{margin-top:15px;padding:14px 16px;border-left:4px solid #0f766e;background:#edf8f5;border-radius:10px;line-height:1.6}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e1eceb}.button{border:1px solid #0f766e;border-radius:10px;padding:10px 14px;background:#0f766e;color:#fff;font-weight:800;cursor:pointer}.button.secondary{background:#fff;color:#0f766e}.source{color:#667b80;font-size:.82rem;line-height:1.5;margin-top:14px}.empty{padding:16px;background:#fff8e6;color:#713f12;border-radius:10px;line-height:1.6}.hidden{display:none!important}@media(max-width:650px){.bar{padding:13px 14px}.shell{padding:20px 13px 45px}.hero{padding:24px}.stem{font-size:1.1rem}}
</style></head>
<body>
<header class="topbar"><div class="bar"><a class="brand" href="./">GSDIPLOMAREVISION</a><a class="back" href="./">← Midterm lecture list</a></div></header>
<main class="shell"><section class="hero"><span class="eyebrow" id="group">Lecture question bank</span><h1 id="title">Loading lecture…</h1><p id="subtitle">Loading the Drive lecture and its unified question bank.</p><a id="drive" class="drive hidden" target="_blank" rel="noreferrer">Open lecture in Google Drive ↗</a></section><div id="bankMeta" class="meta"></div><section id="quiz" class="card hidden"><div class="question-top"><span id="number"></span><span id="difficulty" class="difficulty"></span></div><h2 id="stem" class="stem"></h2><div id="options" class="options"></div><div id="explanation" class="explanation hidden"></div><p id="source" class="source"></p><div class="actions"><button id="previous" class="button secondary">Previous</button><button id="next" class="button">Next</button></div></section><section id="empty" class="card empty">Loading…</section></main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const lectureName=params.get('lecture')||'';const groupId=params.get('group')||'';let questions=[],index=0,answers={};
const slug=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ');
const queryMap={'The Abdomen — Slides':['the abdomen','abdomen'],'The Breast — Slides':['the breast','breast'],'The Upper Limb — Nerves, Vessels & Lymphatics':['upper limb'],'The Lower Limb — Nerves, Vessels & Lymphatics':['lower limb'],'The Pelvis & Perineum — Slides':['pelvis','perineum'],'Principles of Diagnostic Pathology — Lecture 1':['principles of diagnostic pathology'],'Cell Injury and Death — Lecture 2':['cell injury and death'],'Diagnostic Microbiology & Specimen Collection':['diagnostic microbiology','specimen collection'],'Immunology and Serology':['immunology and serology','immunology'],'Microbiology':['microbiology'],'Fluids and Electrolytes':['fluid','electrolyte'],'Shock':['shock'],'Hemorrhage in Surgery':['hemorrhage'],'Blood and Blood Products':['blood and blood products'],'Wound Healing':['wound healing'],'Sterilization and Disinfection':['sterilization','disinfection'],'Medical Ethics':['medical ethics','ethics'],'Consent':['consent'],'Breaking Bad News':['breaking bad news'],'Metabolic Response to Trauma':['metabolic response'],'Nutritional Support in Surgical Patients':['nutrition','nutritional'],'Surgical Infections I':['surgical infections'],'Surgical Infections II':['surgical infections'],'Septic Shock':['septic shock'],'VTE & Acid–Base Balance':['vte','acid base'],'Principles of Surgical Oncology':['surgical oncology'],'Blood Disorder Drugs & Cancer Chemotherapy':['blood disorder','cancer chem'],'Analgesics for Surgery':['analgesic'],'Antibiotics — Lecture 3':['antimicrobial','antibiotic'],'Pharmacology Summary 3':['pharmacology','drug','peptic ulcer','git']};
function matches(q,label){const text=slug([q.source,q.sourceFile,q.topic,q.section].join(' '));const keys=queryMap[label]||[slug(label)];return keys.some(k=>text.includes(slug(k)))}
function render(){const q=questions[index];if(!q)return;$('number').textContent=`Question ${index+1} of ${questions.length}`;$('difficulty').textContent=q.difficulty||'moderate';$('stem').textContent=q.stem;const chosen=answers[q.id];const box=$('options');box.innerHTML='';q.options.slice(0,4).forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.disabled=chosen!==undefined;if(chosen!==undefined&&i===q.correctOptionIndex)b.classList.add('correct');if(chosen!==undefined&&i===chosen&&i!==q.correctOptionIndex)b.classList.add('wrong');const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+i);b.append(l,document.createTextNode(o));b.onclick=()=>{answers[q.id]=i;localStorage.setItem('gsdiploma.lecture.'+lectureName,JSON.stringify(answers));render()};box.appendChild(b)});$('explanation').classList.toggle('hidden',chosen===undefined);if(chosen!==undefined)$('explanation').innerHTML=`<strong>${chosen===q.correctOptionIndex?'Correct answer':'Correct answer is highlighted in green'}</strong>${q.explanation||'Review the lecture source.'}`;$('source').textContent=`Source: ${q.source||q.sourceFile||'Unified bank'}${q.sourceUrl?' · Drive source available':''}`;$('previous').disabled=index===0;$('next').textContent=index===questions.length-1?'Finish bank':'Next question'}
$('previous').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<questions.length-1){index++;render()}else alert('You reached the end of this lecture bank. Your answers remain saved on this browser.')};
Promise.all([fetch('./lecture-links.json').then(r=>r.json()),fetch('../assets/mcq-answers/unified-bank.json').then(r=>r.json())]).then(([catalog,data])=>{let group=catalog.groups.find(g=>g.id===groupId)||catalog.groups.flatMap(g=>g.links.map(x=>({...x,group:g}))).find(x=>x.label===lectureName)?.group;let link=group?.links.find(x=>x.label===lectureName);if(!link){const found=catalog.groups.flatMap(g=>g.links.map(x=>({...x,group:g}))).find(x=>x.label===lectureName);link=found;group=found?.group}const bank=data.questions||[];$('group').textContent=group?.label||'Lecture question bank';$('title').textContent=lectureName||'Lecture question bank';$('subtitle').textContent='Open the original Drive lecture, then practise with questions mapped from the unified GS Diploma bank.';if(link){$('drive').href=link.url;$('drive').classList.remove('hidden')}questions=bank.filter(q=>matches(q,lectureName)).sort(()=>Math.random()-.5).slice(0,40);try{answers=JSON.parse(localStorage.getItem('gsdiploma.lecture.'+lectureName)||'{}')}catch{answers={}};$('bankMeta').innerHTML=`<span>${questions.length} questions available</span><span>Source-linked lecture bank</span><span>Answers saved locally</span>`;if(!questions.length){$('empty').textContent='No unified-bank questions matched this lecture label yet. Open the Drive lecture and use the wider section bank instead.';return}$('empty').classList.add('hidden');$('quiz').classList.remove('hidden');render()}).catch(()=>{$('empty').textContent='Unable to load the lecture catalog or unified question bank.'});
</script></body></html>
