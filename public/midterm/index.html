<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS Diploma Midterm</title>
<meta name="description" content="Midterm revision for the General Surgery Diploma: full exams, practice, rapid rounds, flashcards and spaced review from the course question banks.">
<meta name="theme-color" content="#0e5a66">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GS Midterm">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="./app.css?v=2026.11.18-6">
<script>
  // Apply saved theme and text size before first paint (avoids a flash).
  try {
    var s = JSON.parse(localStorage.getItem('gsd.midterm.v2') || '{}').settings || {};
    if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
    if (s.text) document.documentElement.style.setProperty('--scale', s.text / 100);
  } catch (e) {}

  // Phones in "Desktop site" mode (or in-app browsers that ignore the viewport tag) lay the
  // page out ~1000px+ wide, making everything tiny. Scale back to the real screen width.
  window.gsFitPhone = function () {
    var root = document.documentElement, land = matchMedia('(orientation: landscape)').matches;
    var sw = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    root.style.zoom = '';
    var touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
    var w = root.clientWidth || innerWidth;
    if (touch && sw && sw < 820 && w > sw * 1.2) { root.style.zoom = (w / sw).toFixed(3); root.dataset.fit = 'phone'; }
    else delete root.dataset.fit;
  };
  gsFitPhone();
  addEventListener('resize', gsFitPhone);
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="bar">
    <button class="brand" id="homeBtn" type="button" aria-label="Go to home">
      <span class="logo" aria-hidden="true">GS</span>
      <span><strong>GS Diploma</strong><small>Midterm revision</small></span>
    </button>
    <div class="chips">
      <span class="chip" id="streakChip" title="Daily streak"></span>
      <span class="chip" id="levelChip" title="Level and XP"></span>
      <button class="chip install-chip" type="button" data-install hidden>📲 Install</button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1"><p class="loading">Loading question bank…</p></main>
<nav class="tabbar" aria-label="Main">
  <button data-nav="home" type="button"><span aria-hidden="true">🏠</span>Home</button>
  <button data-nav="exam" type="button"><span aria-hidden="true">📝</span>Exam</button>
  <button data-nav="practice" type="button"><span aria-hidden="true">🎯</span>Practice</button>
  <button data-nav="review" type="button"><span aria-hidden="true">🔁</span>Review</button>
  <button data-nav="settings" type="button"><span aria-hidden="true">⚙︎</span>Settings</button>
</nav>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="settings" aria-labelledby="settingsTitle"></dialog>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="./app.js?v=2026.11.18-6" defer></script>
</body>
</html>
