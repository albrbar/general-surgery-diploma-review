name: Generate AI MCQ drafts

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Section to generate"
        required: true
        default: all
        type: choice
        options:
          - all
          - anatomy
          - pathology
          - pharmacology
          - microbiology-immunology
          - principles-of-surgery
      count:
        description: "Questions per generated section"
        required: true
        default: "40"
        type: choice
        options:
          - "5"
          - "40"
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate drafts with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: |
          set -euo pipefail
          python3 scripts/generate-ai-mcqs.py \
            --section "${{ inputs.section }}" \
            --count "${{ inputs.count }}"

      - name: Audit unified bank quality
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/audit-unified-bank.py | tee /tmp/unified-bank-audit.txt
          cat public/assets/mcq-answers/unified-bank-audit.json

      - name: Commit generated drafts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ai-mcq/manifest.json public/ai-mcq/generated/
          git diff --cached --quiet && { echo "No generated changes"; exit 0; }
          git commit -m "Generate AI MCQ drafts via Groq"
          git push
